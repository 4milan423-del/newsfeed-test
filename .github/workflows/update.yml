name: Päivitä oikeustapausseuranta

on:
  schedule:
    # 05:10 UTC arkisin. Suomen aikaa 07:10 talvella ja 08:10 kesällä.
    # GitHubin cron ei tunne aikavyöhykkeitä, joten kellonaika liikkuu tunnin.
    - cron: "10 5 * * 1-5"
  # Nappi Actions-välilehdellä, jolla ajon voi käynnistää käsin.
  workflow_dispatch:

# Työnkulku kirjoittaa docs-kansion ja state.json-tiedoston takaisin repoon.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v6 ajaa Node 24:llä. Node 20 poistuu runnereista 23.9.2026.
      - uses: actions/checkout@v6
        with:
          # Koko historia, jotta rebase lopussa toimii.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Asenna riippuvuudet
        run: pip install -r requirements.txt

      - name: Aja haku
        # base-url menee RSS-syötteen <link>-kenttään.
        # Muoto on https://KAYTTAJATUNNUS.github.io/REPON-NIMI/
        run: python main.py --base-url "https://4milan423-del.github.io/newsfeed-test/"

      - name: Commitoi tulos
        run: |
          git config user.name "oikeusfeed-bot"
          git config user.email "actions@github.com"
          git add docs state.json
          # Jos mikään ei muuttunut, commit epäonnistuisi ja kaataisi ajon.
          git diff --staged --quiet || git commit -m "Päivitä feed $(date -u +%Y-%m-%d)"
          git push
