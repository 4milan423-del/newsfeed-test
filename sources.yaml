  # ---------- EU: unionin tuomioistuin ja unionin yleinen tuomioistuin ----------
  - id: eu-courts
    name: "Unionin tuomioistuin (EUT ja unionin yleinen tuomioistuin)"
    type: eu_sparql
    court: "EUT"
    weight: 3
    # CJ = tuomio (EUT), TJ = tuomio (yleinen tuomioistuin),
    # CC = julkisasiamiehen ratkaisuehdotus.
    celex_types: ["CJ", "TJ", "CC"]
    language: "fin"
    lookback_days: 150

  - id: curia-press
    name: "Unionin tuomioistuimen lehdistötiedotteet"
    type: plain_rss
    court: "EUT"
    weight: 1
    optional: true
    url: "https://curia.europa.eu/site/rss.jsp?lang=en&secondLang=fr"

  # ---------- Viranomaisratkaisut ----------
  - id: edpb
    name: "Euroopan tietosuojaneuvosto (EDPB)"
    type: plain_rss
    court: "EDPB"
    weight: 2
    url: "https://www.edpb.europa.eu/rss.xml"

  # Tietosuojavaltuutetun omat ratkaisut julkaistaan Finlexissä, jonka
  # hakurajapinta (api.finlex.fi) vaatii avaimen. Siihen asti seurataan
  # toimiston ajankohtaissivua, jolla ratkaisut ja seuraamusmaksut uutisoidaan.
  - id: tsv
    name: "Tietosuojavaltuutetun toimisto"
    type: html_list
    court: "TSV"
    weight: 3
    url: "https://tietosuoja.fi/fi/ajankohtaista"
    link_pattern: "/-/"
    optional: true
