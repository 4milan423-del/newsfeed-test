# Oikeustapausseurannan lähteet ja suodatussäännöt.
# Lisää tai poista lähteitä vapaasti. Koodia ei tarvitse muuttaa.

settings:
  # Kuinka monta päivää taaksepäin feedissä näytetään.
  window_days: 120
  # Montako juttua enintään yhdelle sivulle.
  max_items: 150
  # Sivun otsikko ja omistaja.
  site_title: "Oikeustapausseuranta"
  site_subtitle: "Tietosuoja, teknologia ja datasääntely"
  timezone: "Europe/Helsinki"

# Avainsanat ratkaisevat, mikä pääsee feediin.
# must_any: ainakin yksi näistä pitää osua otsikkoon, tiivistelmään tai
#           asiasanoihin. Jos lista on tyhjä, kaikki pääsevät läpi.
# boost:    nostaa jutun "tärkeä" -luokkaan (näkyy sivulla korostettuna).
# never:    pudottaa jutun pois, vaikka must_any osuisi.
keywords:
  must_any:
    - tietosuoja
    - henkilötiet
    - yksityiselämän suoja
    - GDPR
    - "2016/679"
    - rekisterinpitäj
    - tietosuojavaltuutet
    - tietoturvaloukkaus
    - profilointi
    - automaattinen päätöksenteko
    - evästeet
    - sähköisen viestinnän
    - televiestint
    - sähköinen viestintä
    - tekoäly
    - "2024/1689"
    - AI Act
    - data act
    - datan hallinnointi
    - digipalvelusäädös
    - digimarkkinasäädös
    - DSA
    - DMA
    - NIS2
    - kyberturvallisuus
    - verkkotunnus
    - liikesalaisuu
    - julkisuuslaki
    - asiakirjajulkisuus
    - viestintäsalaisuu
    - valvonta työpaikalla
    - biometri
    - personal data
    - data protection
    - artificial intelligence
    - electronic communications
    - privacy
  boost:
    - tietosuojavaltuutet
    - hallinnollinen seuraamusmaksu
    - "2016/679"
    - tekoäly
    - "2024/1689"
    - tietoturvaloukkaus
    - biometri
  never:
    - avoin työpaikka
    - rekrytointi
    - vuosikertomus
    - toimintakertomus
    - puhelinneuvonta
    - kirjaamo suljettu
    - organisaatio uudistuu
    - stakeholder event
    - save the date
    - webinaari

sources:
