    type: wp_rss
    court: "KHO"
    weight: 3
    url: "https://www.kho.fi/feed/rss-feed?post_type=ratkaisut"

  # ---------- Suomi: erityistuomioistuimet ----------
  - id: mao
    name: "Markkinaoikeus"
    type: wp_rss
    court: "MAO"
    weight: 2
    url: "https://www.markkinaoikeus.fi/feed/rss-feed?post_type=ratkaisu"

  - id: tt
